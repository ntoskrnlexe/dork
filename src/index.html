<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Dork — Zork I in the browser</title>
		<link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				background: #000;
				color: #ddd;
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
				height: 100%;
			}
			body {
				display: flex;
				flex-direction: column;
			}
			#status {
				background: #eee;
				color: #000;
				padding: 2px 0;
				white-space: pre;
				font-family: inherit;
				font-size: 14px;
				line-height: 1.3;
			}
			#toolbar {
				background: #111;
				color: #888;
				font-size: 12px;
				padding: 4px 8px;
				display: flex;
				align-items: center;
				gap: 12px;
			}
			#toolbar input[type='file'] {
				color: #888;
				font: inherit;
			}
			#toolbar button {
				background: #222;
				color: #ccc;
				border: 1px solid #444;
				padding: 2px 8px;
				font: inherit;
				cursor: pointer;
			}
			#toolbar button:hover {
				background: #333;
			}
			#upper-window {
				background: #000;
				color: #ddd;
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
				font-size: 14px;
				line-height: 1.3;
				white-space: pre;
				overflow: hidden;
				display: none;
				padding: 0 4px;
				border-bottom: 1px solid #333;
			}
			#terminal {
				flex: 1 1 auto;
				min-height: 0;
				padding: 4px;
			}
			.xterm,
			.xterm-viewport {
				height: 100% !important;
			}
		</style>
	</head>
	<body>
		<div id="toolbar">
			<label
				>Load story file:
				<input type="file" id="story-input" accept=".z3,.dat,.zip" />
			</label>
			<button id="restart">Restart</button>
			<span id="story-name" style="margin-left: auto"></span>
		</div>
		<div id="status">&nbsp;</div>
		<pre id="upper-window"></pre>
		<div id="terminal"></div>
		<script type="module" src="./frontend.ts"></script>
	</body>
</html>
